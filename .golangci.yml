version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - noctx
    - prealloc
    - unconvert
    - unparam
    - whitespace
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Tests intentionally use odd inputs and table-driven helpers.
      - path: _test\.go
        linters:
          - bodyclose
          - noctx
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
